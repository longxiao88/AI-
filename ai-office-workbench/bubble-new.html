<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>深海气泡</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
  }

  .bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
  }

  #fx {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: auto;
  }
</style>
</head>
<body>
<div class="stage">
  <img class="bg" src="./public/backgrounds/new-bg.jpg" alt="" />
  <canvas id="fx"></canvas>
</div>

<script>
(function () {
  const canvas = document.getElementById('fx');
  const ctx = canvas.getContext('2d');
  let W, H, dpr;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.clientWidth;
    H = canvas.clientHeight;
    canvas.width  = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  const HI      = '210, 230, 246';
  const STEEL   = '128, 168, 186';
  const STEEL_L = '160, 198, 214';

  const bubbles = [];
  const mists   = [];
  const ripples = [];

  // 普通漂浮泡泡
  function make(forceBottom, rMin, rMax) {
    return {
      x: Math.random() * W,
      y: forceBottom ? H + 20 + Math.random() * 40 : Math.random() * H,
      r: rMin + Math.random() * (rMax - rMin),
      speed: 0.25 + Math.random() * 0.7,
      phase: Math.random() * Math.PI * 2,
      phaseSpeed: 0.2 + Math.random() * 0.4,
      alpha: 0.4 + Math.random() * 0.4,
      vx: 0
    };
  }

  // 爆破后分裂出的子泡泡：从爆破点向四周飞散，随后自然上浮
  function spawnBurst(x, y, parentR) {
    let count;
    if (parentR > 12)      count = 5 + Math.floor(Math.random() * 4); // 5-8
    else if (parentR > 5)  count = 3 + Math.floor(Math.random() * 3); // 3-5
    else                   count = 2;                                  // 2
    for (let i = 0; i < count; i++) {
      const ang = Math.random() * Math.PI * 2;
      const spd = 0.8 + Math.random() * 2.2;
      const nr  = Math.max(1.4, parentR * (0.22 + Math.random() * 0.33));
      bubbles.push({
        x: x, y: y, r: nr,
        speed: 0.35 + Math.random() * 0.8,
        phase: Math.random() * Math.PI * 2,
        phaseSpeed: 0.2 + Math.random() * 0.5,
        alpha: 0.5 + Math.random() * 0.5,
        vx: Math.cos(ang) * spd
      });
    }
  }

  // 水雾：柔和弥散、缓慢上升、渐渐变淡消失
  function spawnMist(x, y, r) {
    const count = 12 + Math.floor(Math.random() * 10); // 12-21 颗
    for (let i = 0; i < count; i++) {
      const ang = Math.random() * Math.PI * 2;
      const spd = 0.4 + Math.random() * 1.8;
      mists.push({
        x: x, y: y,
        r: r * (0.12 + Math.random() * 0.34),
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd - 0.5,
        growth: 0.6 + Math.random() * 1.8,
        alpha: 0.35 + Math.random() * 0.4,
        decay: 0.012 + Math.random() * 0.022
      });
    }
    // 爆破核心闪光：一颗快速膨胀、快速消隐的亮斑
    mists.push({
      x: x, y: y,
      r: r * 0.55,
      vx: 0, vy: 0,
      growth: r * 0.06,
      alpha: 0.9,
      decay: 0.05
    });
  }

  // 命中检测：点到泡泡附近即可命中，大泡泡、越近越优先
  function popAt(px, py) {
    let hit = null, bestScore = -Infinity;
    for (const b of bubbles) {
      const d = Math.hypot(px - b.x, py - b.y);
      const limit = b.r * 2 + 12; // 宽松命中范围
      if (d <= limit) {
        const score = b.r - d;    // 越大越好：大泡泡优先、越近越优先
        if (score > bestScore) { bestScore = score; hit = b; }
      }
    }
    if (!hit) return null;

    const idx = bubbles.indexOf(hit);
    if (idx >= 0) bubbles.splice(idx, 1);

    spawnMist(hit.x, hit.y, hit.r);
    // 足够大的泡泡才继续分裂，避免无限爆炸
    if (hit.r > 2.6) spawnBurst(hit.x, hit.y, hit.r);
    return hit;
  }

  // 点击反馈涟漪：无论是否命中都画一个扩散圈，便于判断点击是否生效
  function spawnRipple(x, y, strong) {
    ripples.push({
      x: x, y: y,
      r: strong ? 6 : 4,
      maxR: strong ? 60 : 30,
      speed: strong ? 5 : 2.5,
      alpha: strong ? 0.9 : 0.5
    });
  }

  // 在 window 层监听，避免预览面板/遮挡层影响事件传递
  function handleDown(e) {
    const rect = canvas.getBoundingClientRect();
    const px = e.clientX - rect.left;
    const py = e.clientY - rect.top;
    const hit = popAt(px, py);
    spawnRipple(px, py, !!hit);
  }
  window.addEventListener('pointerdown', handleDown, { passive: true });
  // 兜底：不支持 PointerEvent 的环境
  if (!window.PointerEvent) {
    window.addEventListener('mousedown', handleDown);
    window.addEventListener('touchstart', function (e) {
      const t = e.changedTouches[0];
      if (t) handleDown({ clientX: t.clientX, clientY: t.clientY });
    }, { passive: true });
  }

  // 初始泡泡：加多大泡泡，更好点
  for (let i = 0; i < 40; i++) bubbles.push(make(false, 18, 55));
  for (let i = 0; i < 50; i++) bubbles.push(make(false, 7, 18));
  for (let i = 0; i < 70; i++) bubbles.push(make(false, 2, 6));

  function draw(b) {
    const r = b.r, x = b.x, y = b.y;
    const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.42, r * 0.08, x, y, r);
    g.addColorStop(0,    `rgba(${HI},${0.3 * b.alpha})`);
    g.addColorStop(0.25, `rgba(${STEEL_L},${0.12 * b.alpha})`);
    g.addColorStop(0.62, `rgba(${STEEL},${0.05 * b.alpha})`);
    g.addColorStop(0.88, `rgba(${STEEL_L},${0.16 * b.alpha})`);
    g.addColorStop(1,    `rgba(${STEEL_L},${0.22 * b.alpha})`);
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill();

    ctx.strokeStyle = `rgba(${STEEL_L},${0.4 * b.alpha})`;
    ctx.lineWidth = Math.max(0.7, r * 0.05); ctx.stroke();

    ctx.beginPath(); ctx.arc(x - r * 0.34, y - r * 0.4, r * 0.18, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255, 255, 255, ${Math.min(1, b.alpha * 1.3)})`; ctx.fill();

    ctx.beginPath(); ctx.arc(x - r * 0.14, y - r * 0.52, r * 0.08, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255, 255, 255, ${Math.min(1, b.alpha * 0.9)})`; ctx.fill();
  }

  function drawMist(m) {
    const g = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, m.r);
    g.addColorStop(0,    `rgba(235, 244, 252, ${m.alpha})`);
    g.addColorStop(0.45, `rgba(196, 220, 238, ${m.alpha * 0.55})`);
    g.addColorStop(1,    `rgba(172, 205, 228, 0)`);
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill();
  }

  function drawRipple(rp) {
    ctx.beginPath(); ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(255, 255, 255, ${rp.alpha})`;
    ctx.lineWidth = 1.6;
    ctx.stroke();
  }

  // 保持画面始终有泡泡：不足时从底部补充
  function refill() {
    while (bubbles.length < 40) bubbles.push(make(true, 6, 22));
  }

  let last = performance.now();
  function tick(now) {
    const dt = Math.min((now - last) / 16.67, 3);
    last = now;
    ctx.clearRect(0, 0, W, H);

    // 泡泡
    for (let i = bubbles.length - 1; i >= 0; i--) {
      const b = bubbles[i];
      b.x += b.vx * dt;                 // 水平散开速度
      b.y -= b.speed * dt;              // 向上漂浮
      b.x += Math.sin(b.phase) * 0.4 * dt;
      b.phase += b.phaseSpeed * 0.02 * dt;
      if (b.vx) b.vx *= 0.97;           // 水平速度衰减
      if (b.y < -b.r * 2 || b.x < -b.r * 4 || b.x > W + b.r * 4) {
        b.y = H + 20 + Math.random() * 40;
        b.x = Math.random() * W;
        b.vx = 0;
      }
      draw(b);
    }

    // 水雾
    for (let i = mists.length - 1; i >= 0; i--) {
      const m = mists[i];
      m.x += m.vx * dt;
      m.y += m.vy * dt;
      m.r += m.growth * dt;
      m.alpha -= m.decay * dt;
      if (m.alpha <= 0) { mists.splice(i, 1); continue; }
      drawMist(m);
    }

    // 点击涟漪
    for (let i = ripples.length - 1; i >= 0; i--) {
      const rp = ripples[i];
      rp.r += rp.speed * dt;
      rp.alpha -= 0.04 * dt;
      if (rp.alpha <= 0 || rp.r > rp.maxR) { ripples.splice(i, 1); continue; }
      drawRipple(rp);
    }

    refill();
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
